services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile.dev
        container_name: poll-request-server-dev
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - ./server:/app
            - /app/node_modules
        environment:
            PORT: 3000
            NODE_ENV: development

    client:
        build:
            context: ./client
            dockerfile: Dockerfile.dev
        container_name: poll-request-client-dev
        ports:
            - "127.0.0.1:5173:5173"
        volumes:
            - ./client:/app
            - /app/node_modules
        environment:
            CHOKIDAR_USEPOLLING: "true"
        depends_on:
            - server